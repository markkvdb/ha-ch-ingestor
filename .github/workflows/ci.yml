name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  RUST_BACKTRACE: short

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Deployment script checks
        run: bash tests/deploy-proxmox.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (mock feature)
        run: cargo clippy --all-targets --features mock -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (plaintext build)
        run: cargo test --no-default-features
      - name: Build release (plaintext)
        run: cargo build --release --no-default-features

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build default image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=default
          cache-to: type=gha,mode=max,scope=default
      - name: Build plaintext image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: FEATURES=none
          push: false
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: check licenses
